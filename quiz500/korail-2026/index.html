<main class="panel"><h1>코레일 문항이 과목별 문제은행으로 통합되었습니다</h1>
<p>별도의 코레일 문제 목록을 운영하지 않고, 기존 <strong>통신공학</strong>과 <strong>무선공학</strong> 문제은행 안에서 학습하도록 변경했습니다.</p>
<p>문제 유형을 <strong>코레일 기출</strong> 또는 <strong>코레일 기출 응용</strong>으로 선택하면 해당 문항만 풀 수 있습니다.</p>
