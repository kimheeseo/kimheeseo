<style>

.cut{font-weight:850;color:#1f4f9a}.delta{font-size:11px;font-weight:850}.delta.up{color:#be501d}.delta.down{color:#177e69}.delta.flat{color:#62728e}
.row-support{font-size:10px;color:#916228;display:block}.foot{font-size:12px;color:#687b98;margin:9px 0 14px}

.bar-lines{display:grid;gap:4px}.bar-line{height:12px;background:#eef2f8;border-radius:5px;overflow:hidden}.bar-fill{display:block;height:100%;border-radius:5px;background:#315bc6}
.bar-line.prior .bar-fill{background:#e3a265}.chart-val{font-size:12px;font-weight:850;text-align:right;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:13px;font-size:12px;color:#5e708d}.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;background:#315bc6}.dot.prior{background:#e3a265}

<body><main aria-busy="true">자료를 불러오는 중입니다.</main>
<script>window.QuizMaterialReady.then(()=>{
(async()=>{const PAGE_DATA=await QuizPageData.load('../data/pages/civil-service-exams__cutoff.json');

"use strict";
const DATA=PAGE_DATA.DATA;
const $=s=>document.querySelector(s);
const fmt=v=>v==null||Number.isNaN(v)?"—":Number(v).toLocaleString("ko-KR",{maximumFractionDigits:2});
const safe=x=>String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const state={grade:9,stage:"cut",focus:null};
function rows(){return state.grade===9?DATA.nine:DATA.seven}
function current(r){return state.stage==="psat"&&state.grade===7?r.psat:r.cut}
function prior(r){return state.stage==="psat"&&state.grade===7?r.psat25:r.cut25}
function earlier(r){return state.stage==="psat"&&state.grade===7?r.psat24:r.cut24}
function includesFocus(r){return /전송기술|전기|전산개발|데이터|정보보호|일반기계/.test(r.name)}
function filtered(){
 let g=$("#filter-group").value,q=$("#filter-search").value.trim().toLowerCase();
 let items=rows().filter(r=>(g==="all"||(g==="focus"?includesFocus(r):r.group===g))&&(!q||r.name.toLowerCase().includes(q)));
 let sort=$("#filter-sort").value;
 if(sort==="scoredesc")items.sort((a,b)=>(current(b)??-Infinity)-(current(a)??-Infinity));
 if(sort==="scoreasc")items.sort((a,b)=>(current(a)??Infinity)-(current(b)??Infinity));
 if(sort==="competition")items.sort((a,b)=>b.app/b.slots-a.app/a.slots);
 if(sort==="change")items.sort((a,b)=>((current(b)??0)-(prior(b)??0))-((current(a)??0)-(prior(a)??0)));
 return items;
}
function changeLabel(r){
 const a=current(r),b=prior(r);
 if(a==null||b==null)return "—";
 const d=Number((a-b).toFixed(2));
 return '<span class="delta '+(d>0?"up":d<0?"down":"flat")+'">'+(d>0?"+":"")+fmt(d)+'</span>';
}
function stageText(){return state.grade===7?(state.stage==="psat"?"1차 PSAT":"2차 전공"):"필기"}
function renderTable(){
 const r=filtered(),year=stageText();
 $("#cutoff-head").innerHTML='<tr><th>직군</th><th>모집단위</th><th>선발</th><th>출원</th><th>경쟁률(:1)</th><th>2026 '+year+'</th><th>2025 (비공식)</th><th>2024 (비공식)</th><th>전년 대비</th><th>'+(state.grade===7?(state.stage==="psat"?"1차 합격":"2차 합격"):"필기 응시")+'</th><th>'+(state.grade===7?"1·2차 합격":"필기 합격")+'</th><th>확인일</th><th>신뢰 등급</th></tr>';
 $("#cutoff-body").innerHTML=r.length?r.map(x=>'<tr class="'+(includesFocus(x)?"focus":"")+'"><td>'+safe(x.group)+'</td><td><button type="button" class="rowpick" data-id="'+x.id+'">'+safe(x.name)+'</button>'+(x.special?'<span class="row-support">추가합격 기준 별도</span>':'')+'</td><td>'+fmt(x.slots)+'</td><td>'+fmt(x.app)+'</td><td>'+fmt(x.app/x.slots)+'</td><td class="cut">'+fmt(current(x))+'</td><td>'+fmt(prior(x))+'</td><td>'+fmt(earlier(x))+'</td><td>'+changeLabel(x)+'</td><td>'+fmt(state.grade===7?(state.stage==="psat"?x.pass1:x.pass):x.att)+'</td><td>'+fmt(state.grade===7?x.pass1:x.pass) + (state.grade===7?" / "+fmt(x.pass):"")+'</td><td>'+x.checkedDate+'</td><td>'+x.reliability+'</td></tr>').join(""):'<tr><td colspan="13" class="empty">해당 조건에 일치하는 모집단위가 없습니다.</td></tr>';
 $("#table-caption").textContent='2026 국가직 '+state.grade+'급 · '+year+' 합격선 · 일반모집 '+r.length+'개 세부 단위 · 출원 경쟁률=출원/선발 · 확인 2026-11-21 · '+(state.grade===9?'공식':'비공식')+' (과년도 비공식)';
 document.querySelectorAll(".rowpick").forEach(btn=>btn.addEventListener("click",()=>{state.focus=btn.dataset.id;renderTrend();const el=$("#trend-chart");el.open=true;el.scrollIntoView({behavior:"smooth",block:"start"})}));
}
function renderComparison(){
 let source=filtered(),pick=[...source].sort((a,b)=>Number(includesFocus(b))-Number(includesFocus(a))).slice(0,12),max=Math.max(100,...pick.flatMap(x=>[current(x),prior(x)]).filter(Number.isFinite));
 if(!pick.length){$("#compare-chart").innerHTML='<div class="empty">해당 조건의 데이터가 없습니다.</div>';return}
 $("#compare-chart").innerHTML=pick.map(x=>{const a=current(x),b=prior(x);
  return '<div class="chart-row"><span class="chart-name">'+safe(x.name)+'</span><div class="bar-lines"><div class="bar-line"><i class="bar-fill" style="width:'+Math.max(0,100*a/max)+'%"></i></div><div class="bar-line prior">'+(b==null?'<span style="font-size:10px;color:#8292a8">전년 자료 없음</span>':'<i class="bar-fill" style="width:'+Math.max(0,100*b/max)+'%"></i>')+'</div></div><span class="chart-val">'+fmt(a)+'<br><span style="color:#b8793d">'+fmt(b)+'</span></span></div>'
 }).join("");
}
function updateTrendOptions(){
 const sel=$("#trend-job"),old=state.focus;
 sel.innerHTML=rows().map(r=>'<option value="'+r.id+'">'+safe(r.name)+'</option>').join("");
 const possible=rows().find(r=>r.id===old);
 if(!possible)state.focus=(rows().find(r=>r.name==="전송기술")||rows()[0]).id;
 sel.value=state.focus;
}
function renderTrend(){
 const r=rows().find(x=>x.id===state.focus)||rows()[0];
 $("#trend-job").value=r.id;
 const vals=[earlier(r),prior(r),current(r)];
 const pts=vals.map((v,i)=>v==null?null:{x:105+i*255,y:205-(v-0)*1.7,v,yNum:v});
 const grids=[0,20,40,60,80,100].map(y=>'<line class="plot-grid" x1="64" x2="672" y1="'+(205-y*1.7)+'" y2="'+(205-y*1.7)+'"/><text class="plot-label" x="50" y="'+(210-y*1.7)+'" text-anchor="end">'+y+'</text>').join("");
 const segs=[];for(let i=1;i<pts.length;i++)if(pts[i]&&pts[i-1])segs.push('<line x1="'+pts[i-1].x+'" y1="'+pts[i-1].y+'" x2="'+pts[i].x+'" y2="'+pts[i].y+'" stroke="#315bc6" stroke-width="3" stroke-linecap="round"/>');
 const marks=pts.map((p,i)=>p?'<circle cx="'+p.x+'" cy="'+p.y+'" r="6" fill="#315bc6" stroke="white" stroke-width="2"/><text class="plot-label" x="'+p.x+'" y="'+(p.y-16)+'" text-anchor="middle">'+fmt(p.v)+'</text>':'<text class="plot-label" x="'+(105+i*255)+'" y="204" text-anchor="middle">—</text>').join("");
 $("#trend-plot").innerHTML='<strong>'+safe(r.name)+' · '+state.grade+'급 '+stageText()+'</strong><svg class="chart-line" viewBox="0 0 730 260" role="img" aria-label="'+safe(r.name)+' 2024년부터 2026년까지 합격선 추이">'+grids+segs.join("")+marks+[2024,2025,2026].map((y,i)=>'<text class="plot-label" x="'+(105+i*255)+'" y="237" text-anchor="middle">'+y+'년</text>').join("")+'</svg>';
 $("#trend-table").innerHTML='<table style="min-width:360px"><thead><tr><th>직렬</th><th>2024</th><th>2025</th><th>2026</th><th>2025→2026</th></tr></thead><tbody><tr><td>'+safe(r.name)+'</td><td>'+fmt(vals[0])+'</td><td>'+fmt(vals[1])+'</td><td class="cut">'+fmt(vals[2])+'</td><td>'+changeLabel(r)+'</td></tr></tbody></table>';
}
function refresh(){document.querySelectorAll("[data-grade]").forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.grade===state.grade)));const stage=$("#filter-stage");stage.disabled=state.grade===9;stage.title=state.grade===9?"9급 필기만 해당":"7급 1차 PSAT/2차 전문과목 선택";if(state.grade===9){stage.value="cut";state.stage="cut"};const region=Array.from($("#filter-group").options).find(x=>x.value==="지역");region.disabled=state.grade===7;if(state.grade===7&&$("#filter-group").value==="지역")$("#filter-group").value="all";updateTrendOptions();renderTable();renderComparison();renderTrend()}
document.querySelectorAll("[data-grade]").forEach(b=>b.addEventListener("click",()=>{state.grade=+b.dataset.grade;state.focus=null;refresh()}));
$("#filter-group").addEventListener("change",refresh);
$("#filter-search").addEventListener("input",refresh);
$("#filter-stage").addEventListener("change",e=>{state.stage=e.target.value;refresh()});
$("#filter-sort").addEventListener("change",refresh);
$("#trend-job").addEventListener("change",e=>{state.focus=e.target.value;renderTrend()});
$("#download-csv").addEventListener("click",()=>{
 const head=["급수","직군","모집단위","선발인원","출원인원","출원경쟁률","2026_"+stageText()+"합격선","2025_합격선","2024_합격선","합격인원","확인일","2026 신뢰 등급","과년도 신뢰 등급"];
 const cell=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
 const lines=[head.map(cell).join(",")].concat(filtered().map(r=>[state.grade,r.group,r.name,r.slots,r.app,(r.app/r.slots).toFixed(2),current(r),prior(r),earlier(r),r.pass,r.checkedDate,r.reliability,r.historyReliability].map(cell).join(",")));
 const blob=new Blob(["\uFEFF"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"}),href=URL.createObjectURL(blob),a=document.createElement("a");
 a.href=href;a.download="national_civil_cutoff_"+state.grade+"_"+state.stage+"_2026.csv";a.click();setTimeout(()=>URL.revokeObjectURL(href),1500);
});
// Allow direct links from the six-category civil service study hub.
const incoming=new URLSearchParams(location.search);
if(incoming.get("grade")==="7")state.grade=7;
const group=incoming.get("group");
if(["all","focus","기술","행정","지역"].includes(group))$("#filter-group").value=group;
const q=incoming.get("q");
if(q)$("#filter-search").value=q.slice(0,100);
const stage=incoming.get("stage");
if(state.grade===7&&["psat","cut"].includes(stage)){state.stage=stage;$("#filter-stage").value=stage}
const chosen=rows().find(row=>q&&row.name.includes(q));
if(chosen)state.focus=chosen.id;
refresh();
})().catch(e=>{const p=document.createElement("p");p.setAttribute("role","alert");p.textContent="자료 로드 실패: "+e.message;document.querySelector("main")?.prepend(p)});
}).catch(()=>{});</script><script src="../materials.js"></script></body></html>
