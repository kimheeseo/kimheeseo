(function(){
const slider=document.getElementById('ho-position'),play=document.getElementById('ho-play'),reset=document.getElementById('ho-reset'),person=document.getElementById('ho-person'),line=document.getElementById('ho-line'),status=document.getElementById('ho-status');
let timer=null,lastCell='';
function stop(){if(timer!==null){clearInterval(timer);timer=null}play.textContent='▶ 이동 시작';play.setAttribute('aria-pressed','false')}
function render(){const v=Number(slider.value),cell=v>=60?'B':'A',x=170+4.6*v;person.setAttribute('transform','translate('+x+' 200)');line.setAttribute('x1',cell==='A'?'195':'605');line.setAttribute('x2',String(x));line.setAttribute('stroke',cell==='A'?'#3071d3':'#199a81');const phase=v===0?'이동 시작 전':v===100?'이동 완료':v>=60&&v<75?'A → B 전환 후':v>=40&&v<60?'중첩 영역 진입':'이동 중';slider.setAttribute('aria-valuetext','위치 '+v+'%, 기지국 '+cell+' 연결');const message='현재 연결: 기지국 '+cell+' · '+phase;if(status.textContent!==message)status.textContent=message;lastCell=cell}
slider.addEventListener('input',function(){stop();render()});
play.addEventListener('click',function(){if(timer!==null){stop();return}if(Number(slider.value)>=100)slider.value='0';render();play.textContent='⏸ 일시정지';play.setAttribute('aria-pressed','true');timer=setInterval(function(){slider.value=String(Math.min(100,Number(slider.value)+1));render();if(Number(slider.value)>=100)stop()},100)});
reset.addEventListener('click',function(){stop();slider.value='0';lastCell='';render()});render();
})();

}).catch(()=>{});</script><script src="../materials.js"></script></body></html>
