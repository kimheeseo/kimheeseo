<!doctype html>
<html lang="ko"><head><script src="../quiz-json.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>K-water 4개 유역본부 역할·통합물관리시설 지도</title><style>:root{font-family:system-ui,-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif;color:#1d3856}*{box-sizing:border-box}body{margin:0;background:#f4f8fc}main{max-width:1250px;margin:auto;padding:22px 15px 48px}

<script>window.QuizMaterialReady.then(()=>{
(async()=>{const PAGE_DATA=await QuizPageData.load('../data/pages/interview__kwater-basin-map.json');

const basins=PAGE_DATA.basins;
const sites=PAGE_DATA.sites;
const mapEl=document.getElementById('map');
const tab=document.getElementById('tabs'),detail=document.getElementById('detail');

function renderBasin(b){
 const selected=sites.filter(x=>x[1]===b.name.replace('유역본부','')),points=[[b.name,b.lat,b.long,true],...selected.map(x=>[x[0],x[3],x[4],false])];
 const project=(lat,lon)=>[(lon-125)*90,(39-lat)*90];let view=[0,0,540,520];
 mapEl.innerHTML='<div style="display:flex;gap:8px;padding:8px"><button type="button" id="mapZoomIn" aria-label="지도 확대">＋</button><button type="button" id="mapZoomOut" aria-label="지도 축소">−</button><button type="button" id="mapReset">전체 보기</button></div><svg id="nativeMap" viewBox="0 0 540 520" role="img" aria-label="유역본부 및 대표 시설 위치 개념도" tabindex="0" style="width:100%;height:420px;background:#ecf5fb;touch-action:none"><path d="M270 30 L350 80 L390 155 L430 260 L370 365 L320 425 L210 450 L150 390 L175 300 L170 220 L210 135 Z" fill="#e3edda" stroke="#70856c"/><g id="mapMarkers"></g></svg><p id="mapPlace" style="padding:8px;font-size:14px">좌표 기반 위치 개념도 · 경계·해안선은 설명용이며 정밀 지도가 아닙니다.</p>';
 const svg=document.getElementById('nativeMap'),markers=document.getElementById('mapMarkers'),ns='http://www.w3.org/2000/svg';
 for(const [name,lat,lon,head]of points){const [x,y]=project(lat,lon),g=document.createElementNS(ns,'g'),circle=document.createElementNS(ns,'circle'),text=document.createElementNS(ns,'text');g.setAttribute('role','button');g.setAttribute('tabindex','0');g.setAttribute('aria-label',name);circle.setAttribute('cx',x);circle.setAttribute('cy',y);circle.setAttribute('r',head?11:6);circle.setAttribute('fill',b.color);circle.setAttribute('stroke','#213649');text.setAttribute('x',x+13);text.setAttribute('y',y+5);text.setAttribute('font-size','13');text.textContent=name;g.append(circle,text);const show=()=>document.getElementById('mapPlace').textContent=name+' · 참고 위치 '+lat+', '+lon;g.onclick=show;g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show()}};markers.append(g)}
 const update=()=>svg.setAttribute('viewBox',view.join(' ')),zoom=f=>{view=[view[0]+view[2]*(1-f)/2,view[1]+view[3]*(1-f)/2,Math.max(80,Math.min(1200,view[2]*f)),Math.max(80,Math.min(1200,view[3]*f))];update()};
 document.getElementById('mapZoomIn').onclick=()=>zoom(.8);document.getElementById('mapZoomOut').onclick=()=>zoom(1.25);document.getElementById('mapReset').onclick=()=>{view=[0,0,540,520];update()};svg.onkeydown=e=>{const step=view[2]*.08;if(e.key.startsWith('Arrow')){e.preventDefault();if(e.key==='ArrowLeft')view[0]-=step;if(e.key==='ArrowRight')view[0]+=step;if(e.key==='ArrowUp')view[1]-=step;if(e.key==='ArrowDown')view[1]+=step;update()}};
 let drag=null;svg.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,view:[...view]};svg.setPointerCapture(e.pointerId)};svg.onpointermove=e=>{if(drag){view[0]=drag.view[0]-(e.clientX-drag.x)*view[2]/svg.clientWidth;view[1]=drag.view[1]-(e.clientY-drag.y)*view[3]/svg.clientHeight;update()}};svg.onpointerup=()=>drag=null;svg.onpointercancel=()=>drag=null;
}

function choose(index){const b=basins[index];document.querySelectorAll('.tab').forEach((el,i)=>el.classList.toggle('active',i===index));
detail.innerHTML='<h2>'+b.name+'</h2><p><strong>대표 소재지:</strong> '+b.head+'<br><strong>주요 대상:</strong> '+b.region+'</p><div class="stat">'+b.stats+'</div><p>'+b.summary+'</p><h3>주요 역할</h3><ul>'+b.duty.map(t=>'<li>'+t+'</li>').join('')+'</ul><h3>대표 운영시설</h3><div class="site-list">'+b.examples.map(t=>'<span>'+t+'</span>').join('')+'</div><p><a class="btn" href="'+b.url+'" target="_blank" rel="noopener noreferrer">공식 시설 목록 ↗</a><a class="btn" href="'+b.detail+'" target="_blank" rel="noopener noreferrer">본부 소개 ↗</a></p>';
renderBasin(b);
}
basins.forEach((b,i)=>{const btn=document.createElement('button');btn.type='button';btn.className='tab';const d=document.createElement('span');d.className='dot';d.style.background=b.color;btn.append(d,document.createTextNode(b.name));btn.addEventListener('click',()=>choose(i));tab.appendChild(btn);});choose(0);
})().catch(e=>{const p=document.createElement("p");p.setAttribute("role","alert");p.textContent="자료 로드 실패: "+e.message;document.querySelector("main")?.prepend(p)});
}).catch(()=>{});</script><script src="../materials.js"></script></body></html>
