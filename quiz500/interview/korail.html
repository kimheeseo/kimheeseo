<script>window.QuizMaterialReady.then(()=>{

(function(){
 const tabs=[...document.querySelectorAll(".tab")], search=document.getElementById("search"), status=document.getElementById("search-summary");
 function refresh(){
   const active=document.querySelector('.tab[aria-selected="true"]').dataset.for, section=document.getElementById(active), v=search.value.trim().toLocaleLowerCase("ko-KR");
   let visible=0;
   section.querySelectorAll(".qa").forEach(el=>{el.hidden=!!v&&!el.dataset.text.toLocaleLowerCase("ko-KR").includes(v);if(!el.hidden)visible++;});
   status.textContent=v?("검색 결과 "+visible+"개"):("총 "+section.querySelectorAll(".qa").length+"개 주제 · 질문을 누르면 대본을 확인할 수 있습니다.");
 }
 function activate(tab){
   tabs.forEach(b=>{const on=b===tab;b.setAttribute("aria-selected",String(on));b.tabIndex=on?0:-1;document.getElementById(b.dataset.for).hidden=!on;});
   refresh();
 }
 tabs.forEach(tab=>tab.addEventListener("click",()=>activate(tab)));
 search.addEventListener("input",refresh);refresh();
})();

}).catch(()=>{});</script>
