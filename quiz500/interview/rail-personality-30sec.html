<!doctype html>
<html lang="ko"><head><script src="../quiz-json.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>철도 공기업 인성면접 30초 답변 생성 템플릿</title><style>:root{font-family:system-ui,-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif;color:#233b59}*{box-sizing:border-box}body{margin:0;background:#f6f8fc}main{max-width:980px;padding:24px 18px 60px;margin:auto}h1{font-size:clamp(25px,4vw,34px)}h2{font-size:18px;margin:10px 0}p{color:#52677e;line-height:1.7;font-size:14px}.tip{padding:12px 16px;border-left:4px solid #5278d1;background:#eaf1ff;border-radius:10px}.question{background:white;border:1px solid #dce5f2;border-radius:14px;margin:10px 0;overflow:hidden}.question>summary{cursor:pointer;display:flex;gap:14px;justify-content:space-between;align-items:center;list-style:none;padding:17px;font-weight:800}.question>summary::after{content:"＋";color:#315bc6;font-size:24px}.question[open]>summary::after{content:"−"}.question[open]>summary{background:#edf3ff}.inner{padding:16px}.example{background:#f2f7fc;border:1px solid #d9e7f4;padding:13px;border-radius:11px}.template{background:#fffaf0;border:1px solid #f0dfb9;padding:13px;border-radius:11px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:13px}.field label{display:block;font-size:12px;color:#566c89;margin-bottom:5px}.field input{width:100%;padding:10px;border:1px solid #cad7ea;border-radius:8px;font:inherit}.preview{background:#eaf6f0;border-radius:10px;padding:12px;line-height:1.8;font-size:14px;white-space:pre-wrap;min-height:70px}.copy{background:#315bc6;color:white;padding:9px 13px;border:0;border-radius:9px;cursor:pointer;font-weight:800;margin:8px 0}.hint{font-size:12px;color:#637b93}.special{color:#4264aa;font-size:12px;font-weight:750}@media(max-width:700px){.fields{grid-template-columns:1fr}main{padding:16px 13px}}</style><script src="../study-storage.js"></script><script src="../page-data.js"></script><script src="../material-content.js" data-content="../data/materials/interview__rail-personality-30sec.json"></script><meta name="description" content="코레일 및 서울교통공사 인성면접 예상 질문별 30초 답변 예시와 개인 경험 빈칸 입력 템플릿"><link rel="canonical" href="https://kimheeseo.github.io/kimheeseo/quiz500/interview/rail-personality-30sec.html"><meta property="og:type" content="website"><meta property="og:locale" content="ko_KR"><meta property="og:site_name" content="통신직 준비"><meta property="og:title" content="철도 공기업 인성면접 30초 답변 생성 템플릿"><meta property="og:description" content="코레일 및 서울교통공사 인성면접 예상 질문별 30초 답변 예시와 개인 경험 빈칸 입력 템플릿"><meta property="og:url" content="https://kimheeseo.github.io/kimheeseo/quiz500/interview/rail-personality-30sec.html"><meta property="og:image" content="https://kimheeseo.github.io/kimheeseo/quiz500/assets/og-telecom.png"><meta property="og:image:width" content="1734"><meta property="og:image:height" content="907"><meta property="og:image:alt" content="통신직 준비 · 통신공학·무선공학·K-water · 오늘 복습부터 모의고사까지"><link rel="icon" href="../assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="../accessibility.css"></head><body><main aria-busy="true">자료를 불러오는 중입니다.</main>
<script>window.QuizMaterialReady.then(()=>{
(async()=>{const PAGE_DATA=await QuizPageData.load('../data/pages/interview__rail-personality-30sec.json');

const company=new URLSearchParams(location.search).get('org')==='metro'?'서울교통공사':'한국철도공사(코레일)';
const key=company.startsWith('서울')?'metro':'korail';
document.getElementById('title').textContent=company+' · 인성면접 30초 예상 답변';
const topics=PAGE_DATA.topics;
const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const container=document.getElementById('topics');
topics.forEach((t,i)=>{
const slots=[...new Set([...t[3].matchAll(/\[([^\]]+)\]/g)].map(m=>m[1]))];
const d=document.createElement('details');d.className='question';
d.innerHTML='<summary><span><span class="special">'+String(i+1).padStart(2,'0')+' · '+safe(t[0])+' · 30초</span><br>'+safe(t[1])+'</span></summary><div class="inner"><h2>30초 예상 답변</h2><p class="example">'+safe(t[2])+'</p><h2>내 경험으로 채우는 템플릿</h2><p class="template">'+safe(t[3])+'</p><div class="fields"></div><h2>완성 문장 미리보기</h2><div class="preview" aria-live="polite"></div><button class="copy" type="button">완성 문장 복사</button><p class="hint">대괄호가 남아 있으면 미작성 항목입니다. 허위 실적은 넣지 마세요.</p></div>';
container.appendChild(d);
const fields=d.querySelector('.fields'),preview=d.querySelector('.preview');const entries={};slots.forEach(slot=>{const wrap=document.createElement('div');wrap.className='field';const label=document.createElement('label');const input=document.createElement('input');const id='slot-'+i+'-'+slot;input.id=id;label.htmlFor=id;label.textContent=slot;input.placeholder=slot==='회사명'?company:'직접 입력';try{input.value=StudyStore.getRaw('interview30-'+key+'-'+i+'-'+slot)||'';}catch(e){}entries[slot]=input;wrap.append(label,input);fields.appendChild(wrap);input.addEventListener('input',()=>{try{StudyStore.setRaw('interview30-'+key+'-'+i+'-'+slot,input.value);}catch(e){}update();});});
function update(){preview.textContent=t[3].replace(/\[([^\]]+)\]/g,(_,name)=>entries[name]?.value.trim()||(name==='회사명'?company:'['+name+']'));}
update();d.querySelector('.copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(preview.textContent);d.querySelector('.copy').textContent='복사 완료';setTimeout(()=>d.querySelector('.copy').textContent='완성 문장 복사',1500)}catch(e){d.querySelector('.copy').textContent='복사 실패 · 텍스트를 직접 선택하세요';}});
});
})().catch(e=>{const p=document.createElement("p");p.setAttribute("role","alert");p.textContent="자료 로드 실패: "+e.message;document.querySelector("main")?.prepend(p)});
}).catch(()=>{});</script><script src="../materials.js"></script></body></html>
