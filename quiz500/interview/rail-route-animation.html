<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>움직이는 철도 노선도</title><style>body{margin:0;background:#f1f6fc;color:#17304f;font:14px system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:16px}h1{font-size:21px;margin:0}p{line-height:1.65;color:#4d6178}.route{background:white;border:1px solid #dae5f3;border-radius:12px;padding:12px;margin:9px 0;overflow:auto}.line{font-weight:800}.track{min-width:440px;display:block;width:100%;height:86px}button{background:#163e68;color:white;border:0;border-radius:8px;padding:9px 14px;cursor:pointer}a{color:#175e9b}@media(prefers-reduced-motion:reduce){.train{display:none}}</style></head><body><main><h1 id="title"></h1><p>주요 역만 고른 학습용 노선 개요입니다. 지리적 거리·전체 역·지선·운영 경계를 정확히 표현하지 않으며, 움직이는 열차는 실제 위치·운행 시간표가 아닙니다.</p><button id="toggle" type="button" aria-pressed="false">⏸ 애니메이션 일시정지</button><div id="routes"></div><p id="source"></p></main><script>
const metro=[['1호선','#1954a6',['서울역','시청','종각','종로3가','동대문','청량리']],['2호선','#35a455',['시청','을지로입구','왕십리','잠실','강남','신도림','시청']],['3호선','#ef7b31',['지축','연신내','종로3가','고속터미널','수서','오금']],['4호선','#32a9d6',['당고개','창동','동대문','서울역','사당','남태령']],['5호선','#995cb4',['방화','김포공항','여의도','광화문','왕십리','하남검단산']],['6호선','#af6531',['응암','연신내','공덕','이태원','약수','신내']],['7호선','#6a7d2e',['장암','노원','건대입구','고속터미널','대림','온수']],['8호선','#e55d83',['암사역사공원','암사','천호','잠실','가락시장','모란']]];
const korail=[['1호선 경부·장항','#1954a6',['서울','용산','구로','수원','평택','천안','신창']],['1호선 경인','#1954a6',['구로','부천','부평','동암','주안','인천']],['1호선 경원','#1954a6',['연천','소요산','의정부','광운대','청량리']],['3호선 일산','#ef7b31',['대화','주엽','백석','대곡','삼송','지축']],['4호선 과천·안산','#32a9d6',['남태령','정부과천청사','금정','안산','오이도']],['경의중앙선','#65b7a5',['문산','대곡','홍대입구','용산','왕십리','용문','지평']],['수인분당선','#d5a92b',['청량리','왕십리','선릉','죽전','수원','오이도','인천']],['경춘선','#27a886',['청량리','상봉','평내호평','가평','춘천']],['경강선','#4884cb',['판교','경기광주','이천','여주']],['서해선','#9abf32',['일산','대곡','김포공항','소사','원시']],['동해선','#6eaad0',['부전','벡스코','기장','태화강']]];
const isMetro=new URLSearchParams(location.search).get('org')==='metro',data=isMetro?metro:korail;
document.getElementById('title').textContent=(isMetro?'서울교통공사':'코레일 광역철도')+' · 움직이는 노선 개요';
document.getElementById('source').innerHTML=isMetro?'출처: <a target="_blank" rel="noopener" href="https://news.seoul.go.kr/traffic/archives/1551">서울시 지하철 노선 안내 ↗</a> · 도시철도 공동운영 및 구간별 운영기관은 별도 확인':'출처: <a target="_blank" rel="noopener" href="https://info.korail.com/info/selectBbsNttView.do?bbsNo=199&amp;key=911&amp;nttNo=23761">코레일 광역철도 운영 안내 ↗</a> · 일부 역·지선 생략';
data.forEach(([name,color,stations],row)=>{const div=document.createElement('section');div.className='route';const n=stations.length;let marks=stations.map((s,i)=>{const x=35+i*630/(n-1);return '<circle cx="'+x+'" cy="32" r="5" fill="white" stroke="'+color+'" stroke-width="3"/><text x="'+x+'" y="64" text-anchor="middle" font-size="12" fill="#203650">'+s+'</text>'}).join('');div.innerHTML='<div class="line" style="color:'+color+'">'+name+'</div><svg class="track" viewBox="0 0 700 86" role="img" aria-label="'+name+' 주요 역: '+stations.join(', ')+'"><path d="M35 32 H665" stroke="'+color+'" stroke-width="7" stroke-linecap="round"/>'+marks+'<g class="train"><rect x="-12" y="-10" width="24" height="20" rx="6" fill="#15395b" stroke="white" stroke-width="2"/><rect x="-6" y="-6" width="12" height="6" rx="2" fill="#b4e7f5"/><animateMotion dur="'+(9+row%4*2)+'s" repeatCount="indefinite" path="M35 32 H665 H35"/></g></svg>';document.getElementById('routes').appendChild(div)});
let paused=false;document.getElementById('toggle').onclick=function(){paused=!paused;document.querySelectorAll('svg.track').forEach(s=>paused?s.pauseAnimations():s.unpauseAnimations());this.textContent=paused?'▶ 애니메이션 재생':'⏸ 애니메이션 일시정지';this.setAttribute('aria-pressed',String(paused))};
</script></body></html>
