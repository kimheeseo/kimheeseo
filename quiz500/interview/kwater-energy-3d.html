let activeId='soyang',paused=false,speed=1,labelsOn=true,elapsed=0,prev=performance.now();
function build(id){
 activeId=id;const a=byId[id];if(!a)return;resetRoot();
 if(a.kind==='tidal')tidal();else if(a.kind==='solar')solar();else if(a.kind==='wind')wind();else hydro(id);
 addInspection(a.kind,id);
 document.getElementById('facilityTitle').textContent=a.name;
 document.getElementById('facilitySubtitle').textContent=a.region+' · '+a.design;
 document.getElementById('region').textContent=a.region+' · '+a.river;
 document.getElementById('design').textContent=a.design;
 document.getElementById('highlight').textContent=a.highlight;
 document.getElementById('summary').textContent=a.summary;
 document.getElementById('capacity').textContent=a.elec;
 document.getElementById('featureText').textContent=a.feature+' — '+a.summary;
 document.getElementById('energyFlow').textContent=a.kind==='solar'?'태양광 → PV 직류 → 인버터 교류 → 변압기':a.kind==='wind'?'바람 → 블레이드 → 발전기 → 변압기':a.kind==='tidal'?'밀물 → 터빈 → 발전기 → 변압기':'저수지 낙차 → 수차 → 발전기 → 변압기';
 document.getElementById('official').href=a.source;
 labels.forEach(l=>l.visible=labelsOn);
 setView('iso');elapsed=0;
}
function setView(type){
 const kind=byId[activeId]?.kind||'embankment';
 const broad=kind==='tidal',coastal=kind==='solar'||kind==='wind';
 const center=kind==='wind'?20:10;
 const v=type==='top'?[.01,broad?215:coastal?175:135,.01,0,center,0]:
 type==='front'?[0,kind==='wind'?48:35,broad?-156:-94,0,center,0]:
 broad?[112,83,147,0,center,0]:coastal?[96,72,113,0,center,0]:[71,54,88,0,center,0];
 camera.position.set(...v.slice(0,3));controls.target.set(...v.slice(3));controls.update();
 document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===type));
}
document.getElementById('facility').onchange=e=>build(e.target.value);
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));
document.getElementById('play').onclick=e=>{paused=!paused;e.currentTarget.textContent=paused?'▶ 재생':'⏸ 일시정지';e.currentTarget.classList.toggle('active',!paused);};
document.getElementById('reset').onclick=()=>build(activeId);
document.getElementById('labels').onclick=e=>{labelsOn=!labelsOn;labels.forEach(l=>l.visible=labelsOn);e.currentTarget.textContent=labelsOn?'구조물 라벨 ✓':'구조물 라벨 숨김';};
document.getElementById('speed').oninput=e=>{speed=Number(e.target.value);document.getElementById('speedLabel').textContent=speed.toFixed(1)+'×';};
function resize(){const r=canvas.getBoundingClientRect();const w=Math.max(1,Math.round(r.width)),h=Math.max(1,Math.round(r.height));if(canvas.width!==w||canvas.height!==h){renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}}
function animate(now){requestAnimationFrame(animate);const dt=Math.min(.06,(now-prev)/1000);prev=now;resize();if(!paused){elapsed+=dt*speed;for(const w of inspectionWorkers){w.g.position.x=w.x+Math.sin(elapsed*.5)*2;w.leg1.rotation.x=Math.sin(elapsed*3)*.35;w.leg2.rotation.x=-w.leg1.rotation.x;w.arm.rotation.z=-.7+Math.sin(elapsed*2)*.25;}for(const d of rotors){d.obj.rotation[d.axis]+=dt*speed*d.speed;}
for(const x of dots){const t=(elapsed*.14+x.offset)%1,pos=t*(x.pts.length-1),i=Math.min(x.pts.length-2,Math.floor(pos));x.obj.position.lerpVectors(x.pts[i],x.pts[i+1],pos-i);}
for(let i=0;i<waterParts.length;i++){const o=waterParts[i];if(o.isMesh && o.geometry?.type==='PlaneGeometry')o.position.y+=Math.sin(elapsed*2+i)*.001;}
}controls.update();renderer.render(scene,camera);}
build('soyang');requestAnimationFrame(animate);
