<script>window.QuizMaterialReady.then(()=>{
(async()=>{const PAGE_DATA=await QuizPageData.load('../data/pages/interview__rail-workplaces.json');

const raw=PAGE_DATA.raw,korailSource='https://info.korail.com/info/contents.do?key=884';
let org=new URLSearchParams(location.search).get('org')==='metro'?'metro':'korail';
const $=id=>document.getElementById(id);
function selectPlace(x){
 const coord=x[3]+','+x[4];
 const search='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(x[2]+' '+x[0]);
 const src=x[7]||korailSource;
 $('map').src='https://maps.google.com/maps?q='+encodeURIComponent(coord)+'&z=13&output=embed';
 $('map').title='구글 지도: '+x[0]+'의 참고 위치';
 $('map-external').href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(coord);
 $('detail').innerHTML='<h2>'+x[0]+'</h2><p><b>구분:</b> '+x[5]+'<br><b>대표 위치:</b> '+x[1]+'<br><b>참고:</b> '+x[6]+'</p><p>지도 핀은 정확한 근무지 주소가 아닌 참고점입니다.</p><p><a href="'+search+'" target="_blank" rel="noopener noreferrer">Google 지도에서 사업장명 검색 ↗</a> · <a href="'+src+'" target="_blank" rel="noopener noreferrer">사업장 관련 자료 ↗</a></p>';
}
function render(){
 const chosen=raw[org].filter(x=>$('category').value==='all'||x[5]===$('category').value);
 $('page-title').textContent=(org==='metro'?'서울교통공사':'코레일')+' 주요 근무지·사업장 위치';
 $('metro-tab').classList.toggle('active',org==='metro');$('korail-tab').classList.toggle('active',org==='korail');
 $('count').textContent=chosen.length+'곳(참고 위치)';$('place-list').innerHTML='';
 for(const x of chosen){const btn=document.createElement('button');btn.type='button';btn.className='place';btn.innerHTML='<b>'+x[0]+'</b><span>'+x[5]+' · '+x[2]+'</span>';btn.addEventListener('click',()=>selectPlace(x));$('place-list').appendChild(btn)}
 if(chosen.length)selectPlace(chosen[0]);else{$('detail').innerHTML='<h2>해당 구분의 장소가 없습니다</h2><p>다른 구분을 선택해 주세요.</p>';$('map').removeAttribute('src');$('map').title='선택된 참고 위치 없음';$('map-external').href='https://www.google.com/maps'}
}
$('metro-tab').addEventListener('click',()=>{org='metro';$('category').value='all';render()});
$('korail-tab').addEventListener('click',()=>{org='korail';$('category').value='all';render()});
$('category').addEventListener('change',render);render();
})().catch(e=>{const p=document.createElement("p");p.setAttribute("role","alert");p.textContent="자료 로드 실패: "+e.message;document.querySelector("main")?.prepend(p)});
}).catch(()=>{});</script><script src="../materials.js"></script></body></html>
