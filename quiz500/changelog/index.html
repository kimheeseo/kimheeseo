<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>전체 변경 일지 | 통신직 준비</title><meta name="description" content="통신직 준비 사이트의 날짜별 전체 업데이트·문항 검증·기능 변경 기록">
<style>:root{font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;background:#f5f7fc;color:#223958}*{box-sizing:border-box}body{margin:0}main{max-width:900px;margin:auto;padding:30px 15px 85px}h1{font-size:clamp(27px,4vw,41px)}h2{font-size:21px;margin:31px 0 12px;color:#2659a3}p{color:#5d718c;line-height:1.8}a{color:#275bb2}.entry{border:1px solid #d9e5f3;background:#fff;border-radius:16px;padding:19px;margin:17px 0}.entry h2{margin:0 0 12px}.entry p{font-size:13px;margin:7px 0;color:#465f80}.entry p::first-letter{color:#285bb1}.muted{font-size:12px;color:#8493a5}.details{display:flex;flex-wrap:wrap;gap:8px}.button{border-radius:9px;border:1px solid #c4d7ef;padding:10px;text-decoration:none;font-weight:800;font-size:13px}:focus-visible{outline:3px solid #7398dc;outline-offset:2px}</style><link rel="canonical" href="https://kimheeseo.github.io/kimheeseo/quiz500/changelog/"><meta property="og:type" content="website"><meta property="og:locale" content="ko_KR"><meta property="og:title" content="변경 일지 | 통신직 준비"><meta property="og:description" content="통신직 취업 준비 사이트 문제은행 및 학습 기능 개선 내역 전체 변경 일지."><meta property="og:url" content="https://kimheeseo.github.io/kimheeseo/quiz500/changelog/"><meta property="og:image" content="https://kimheeseo.github.io/kimheeseo/quiz500/assets/og-study.svg"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image"><style>@media(max-width:360px){body{max-width:100%;overflow-x:hidden}pre,table{max-width:100%}img,iframe{max-width:100%}}</style></head><body><main><a href="../">← 통신직 준비 홈</a><h1>전체 변경 일지</h1><p>기존 기능 변경·문항 상태·출처 정리·학습 기록 등 전체 수정 내역을 날짜 순서로 제공합니다. 기록은 GitHub 저장소의 `CHANGELOG.md`에서 직접 읽습니다.</p><div class="details"><a class="button" href="../SCHEMA.md">문제은행 스키마 문서</a><a class="button" href="https://github.com/kimheeseo/kimheeseo/blob/main/quiz500/CHANGELOG.md" target="_blank" rel="noopener noreferrer">GitHub 변경 일지 원문</a></div><div id="entries"><p>변경 이력을 불러오는 중입니다.</p></div><p class="muted">자료·문항이 추가되거나 검증 정보가 변경되면 CHANGELOG.md에 기록합니다.</p></main>
<script>
"use strict";
function sectionify(markdown){
 const root=document.getElementById("entries");root.replaceChildren();let section=null;
 for(const line of markdown.split(/\r?\n/)){
  if(/^##\s+/.test(line)){
   section=document.createElement("section");section.className="entry";
   const title=document.createElement("h2");title.textContent=line.replace(/^##\s+/,"");section.append(title);root.append(section);
  }else if(/^[-*]\s+/.test(line)||line.trim()){
   if(!section)continue;const p=document.createElement("p");p.textContent=line.replace(/^[-*]\s+/,"• ");section.append(p);
  }
 }
 if(!root.children.length)root.textContent="표시할 변경 내역이 없습니다.";
}
fetch("../CHANGELOG.md",{cache:"no-store"}).then(r=>{if(!r.ok)throw Error("CHANGELOG.md를 읽지 못했습니다.");return r.text()}).then(sectionify).catch(e=>document.getElementById("entries").textContent="변경 일지 로드 실패: "+e.message);
</script></body></html>
