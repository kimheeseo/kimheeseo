<title>정보통신 기출 | 통신직 준비</title><style>
:root{font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;color-scheme:light;background:#f4f7fc;color:#20334e}
*{box-sizing:border-box}body{margin:0}a{color:#315ccb}a:hover{text-decoration:none}button,select,input,textarea{font:inherit}button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #7190ef;outline-offset:3px}
header{background:#14233e;color:white}.headin{max-width:1080px;margin:auto;padding:19px 22px}.headin a{color:#cadbff;text-decoration:none;font-weight:750;font-size:13px}
main{max-width:1080px;margin:auto;padding:28px 20px 84px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.11em;color:#496bc5}h1{font-size:clamp(28px,4vw,41px);letter-spacing:-.05em;margin:8px 0 13px}h2{font-size:22px;letter-spacing:-.03em;margin:0 0 12px}p{color:#53667d;line-height:1.75;margin:8px 0}.hero,.filters,.question,.guide{border:1px solid #dce5f0;border-radius:19px;background:#fff;padding:24px;box-shadow:0 9px 25px #21345008;margin-bottom:18px}
.kpis{display:flex;flex-wrap:wrap;gap:10px;margin:19px 0}.kpi{background:#edf2fe;border-radius:10px;padding:10px 14px;font-size:14px;font-weight:800;color:#3559ae}
.warning{background:#fff8e9;color:#785c2c;border-left:4px solid #cf9940;border-radius:10px;padding:13px 16px;font-size:13px;line-height:1.75}
.filtersgrid{display:grid;grid-template-columns:1fr 1fr 1.5fr;gap:12px;margin:16px 0}label{font-weight:750;font-size:13px;color:#526682}select,input[type=search]{margin-top:7px;padding:12px;border:1px solid #cbd8e9;background:#f9fbff;color:#233a54;border-radius:10px;width:100%}
.count{font-weight:800;color:#3d62bd}.topicbar{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}.pill{display:inline-block;border-radius:8px;padding:5px 9px;font-size:12px;font-weight:760;color:#335cb5;background:#e9effd;margin-right:6px}.pill.secondary{background:#e9f5f0;color:#25745b}.pill.score{background:#fff3df;color:#896025}
.question h3{font-size:19px;letter-spacing:-.022em;line-height:1.7;margin:16px 0 12px;white-space:pre-wrap}.subitems{padding:0;list-style:none;margin:14px 0}.subitems li{padding:13px 14px;border:1px solid #e0e8f3;border-radius:11px;background:#f8fbff;margin:8px 0;line-height:1.7;color:#304967}.subitems strong{color:#315fbd;margin-right:10px}.weight{color:#8a6027;font-weight:700;font-size:12px}
.source{color:#78879c;font-size:12px;line-height:1.6;margin:14px 0}.answerhead{display:flex;align-items:center;justify-content:space-between;gap:9px;flex-wrap:wrap;font-size:14px;font-weight:800;margin:18px 0 8px}
textarea{width:100%;min-height:125px;resize:vertical;border-radius:12px;border:1px solid #cad6e7;background:#fcfdff;color:#213754;padding:13px 15px;font-size:14px;line-height:1.7}
.actions{display:flex;gap:9px;align-items:center;margin-top:11px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border:1px solid #cbd8ed;background:white;color:#3657a8;border-radius:10px;padding:10px 14px;font-size:13px;font-weight:760;cursor:pointer}.btn.primary{background:#365dc7;color:white;border-color:#365dc7}.state{color:#52755b;font-size:12px;min-height:18px}.empty{background:#fff;padding:22px;border-radius:14px;color:#586b83}footer{font-size:12px;color:#7989a0;line-height:1.8;margin-top:35px}
@media(max-width:700px){.filtersgrid{grid-template-columns:1fr}.hero,.filters,.question,.guide{padding:16px}main{padding:20px 12px 60px}.question h3{font-size:17px}}
@media print{header,.filters,.actions,.answerhead,.state{display:none!important}body{background:white}.hero,.question,.guide{break-inside:avoid;box-shadow:none}.question{border:1px solid #bbb}textarea{display:none}}
.reference{border:1px solid #bdd0ed;border-radius:12px;margin:18px 0;background:#f8fbff;overflow:hidden}.reference summary{cursor:pointer;padding:15px;font-weight:850;color:#2b51ab;list-style:none}.reference summary::-webkit-details-marker{display:none}.reference summary:before{content:"▸";margin-right:8px}.reference[open] summary:before{content:"▾"}.reference summary small{font-size:11px;color:#7e6842;margin-left:7px}.reference-body{padding:2px 18px 18px;border-top:1px solid #d9e3f3}.reference-body p{font-size:14px}.reference-body h4{font-size:15px;color:#2e4f8e;margin:17px 0 9px}.reference-body li{line-height:1.8;margin:8px 0;color:#344d6b;font-size:14px}.reference-body ul{padding-left:23px}.disclaimer{background:#fff7e8;padding:13px;border-radius:9px;color:#765b29!important;font-size:12px!important}@media print{.reference-body{display:block!important}}
</style><script src="../study-storage.js"></script><script src="../page-data.js"></script><script src="../material-content.js" data-content="../data/materials/information-communication__index.json"></script><meta name="description" content="2020·2021년 해양경찰 정보통신 주관식 기출 원문 6문항, 단원·연도별 분류, 배점 및 답안 작성 기능"><link rel="canonical" href="https://kimheeseo.github.io/kimheeseo/quiz500/information-communication/"><meta property="og:type" content="website"><meta property="og:locale" content="ko_KR"><meta property="og:site_name" content="통신직 준비"><meta property="og:title" content="정보통신 기출 | 통신직 준비"><meta property="og:description" content="2020·2021년 해양경찰 정보통신 주관식 기출 원문 6문항, 단원·연도별 분류, 배점 및 답안 작성 기능"><meta property="og:url" content="https://kimheeseo.github.io/kimheeseo/quiz500/information-communication/"><meta property="og:image" content="https://kimheeseo.github.io/kimheeseo/quiz500/assets/og-telecom.png"><meta property="og:image:width" content="1734"><meta property="og:image:height" content="907"><meta property="og:image:alt" content="통신직 준비 · 통신공학·무선공학·K-water · 오늘 복습부터 모의고사까지"><link rel="icon" href="../assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="../accessibility.css"></head><body>
<header><div class="headin"><a href="../">← 통신직 준비</a>　 /　 <a href="../communication-quiz-500/">1. 통신공학</a>　 /　 정보통신 기출</div></header>
<main aria-busy="true">자료를 불러오는 중입니다.</main>
<script>window.QuizMaterialReady.then(()=>{
(async()=>{const PAGE_DATA=await QuizPageData.load('../data/pages/information-communication__index.json');

const REFERENCES=PAGE_DATA.REFERENCES;
const DB=PAGE_DATA.DB;
const $=id=>document.getElementById(id);
const escapeHtml=v=>String(v??"").replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[x]));
const KEY="quiz500-info-communication-answer-v1:";
const topics=[...new Set(DB.questions.map(q=>q.category))].sort((a,b)=>a.localeCompare(b,"ko"));
topics.forEach(topic=>$("topicFilter").add(new Option(topic,topic)));
let answerCache={};DB.questions.forEach(q=>{try{answerCache[q.id]=StudyStore.getRaw(KEY+q.id)||""}catch(e){answerCache[q.id]=""}});
function selected(){
 const year=$("yearFilter").value,topic=$("topicFilter").value,word=$("keyword").value.trim().toLocaleLowerCase("ko");
 return DB.questions.filter(q=>(!year||q.year===Number(year))&&(!topic||q.category===topic)&&(!word||[q.title,q.category,DB.sources[q.year],q.no+"번",...q.detail.map(x=>x.text)].join(" ").toLocaleLowerCase("ko").includes(word)));
}
function render(){
 const result=selected();
 $("resultCount").textContent=result.length+" / "+DB.questions.length+"문항";
 $("questionList").innerHTML=result.length?result.map(q=>`
 <article class="question" id="${escapeHtml(q.id)}" data-id="${escapeHtml(q.id)}">
 <div><span class="pill">${escapeHtml(q.year+"년도 "+(q.year===2020?"제2차 경찰공무원 실기시험":"상반기 경찰공무원 채용 필기시험")+" 기출")}</span><span class="pill secondary">${escapeHtml(q.category)}</span><span class="pill score">${escapeHtml(q.form+" · "+q.score+"점")}</span></div>
 <h3>${escapeHtml(q.no+". "+q.title)} <span class="weight">(${escapeHtml(q.form)}, ${q.score}점)</span></h3>
 ${q.detail.length?'<ol class="subitems">'+q.detail.map(d=>'<li><strong>'+escapeHtml(d.name)+'.</strong>'+escapeHtml(d.text)+(d.score?' <span class="weight">('+d.score+'점)</span>':'')+'</li>').join('')+'</ol>':''}
 <p class="source">검토 중 · 채점 보류 · 메타 확인일 2026-11-21 · 외부 참고<br>출처: ${escapeHtml(DB.sources[q.year])} · 제${q.no}문항 · 원문 시험지 1쪽</p>

 <details class="reference" id="explain-${q.id}"><summary>모범답안 예시·해설 보기 <small>비공식 학습용</small></summary><div class="reference-body"><p><strong>답안 작성 요지:</strong> ${escapeHtml(REFERENCES[q.id].intro)}</p>${REFERENCES[q.id].sections.map(s=>'<section><h4>'+escapeHtml(s.title)+'</h4><ul>'+s.points.map(p=>'<li>'+escapeHtml(p)+'</li>').join('')+'</ul></section>').join('')}<p class="disclaimer">※ 첨부 시험지에는 공식 정답·채점기준이 없습니다. 이 답안은 시험 범위의 통신공학 원리를 바탕으로 새롭게 작성한 <b>비공식 예시</b>이며 실제 시험 채점 기준과 다를 수 있습니다.</p></div></details>
 <p><a href="https://github.com/kimheeseo/kimheeseo/issues/new?${new URLSearchParams({template:"question-error.md",title:"[문항 오류] "+q.id,body:"문항 ID: "+q.id+"\n사유: 정답 오류 / 해설 오류 / 문제 오타 / 수식 깨짐 / 기타\n메모:"}).toString()}" target="_blank" rel="noopener">정답/해설 오류 신고</a></p><div class="answerhead"><label for="answer-${q.id}">내 답안 작성 (자기 학습용)</label><span class="state" id="state-${q.id}">${answerCache[q.id]?"저장된 답안 있음":""}</span></div>
 <textarea id="answer-${q.id}" data-id="${q.id}" placeholder="핵심 개념·비교 기준·식·예시 등을 작성하세요. 공식 모범답안은 제공되지 않습니다. 위의 비공식 해설을 참고하세요.">${escapeHtml(answerCache[q.id])}</textarea>
 <div class="actions"><button class="btn primary save" type="button" data-id="${q.id}">내 답안 저장</button><button class="btn clear" type="button" data-id="${q.id}">입력 초기화</button></div>
 </article>`).join(""):'<p class="empty">해당 조건의 문제가 없습니다.</p>';
}
$("questionList").addEventListener("input",e=>{if(e.target.matches("textarea[data-id]"))answerCache[e.target.dataset.id]=e.target.value});
$("questionList").addEventListener("click",e=>{
 const btn=e.target.closest("button[data-id]");if(!btn)return;
 const id=btn.dataset.id,textarea=$("answer-"+id),state=$("state-"+id);
 if(btn.classList.contains("save")){answerCache[id]=textarea.value;try{StudyStore.setRaw(KEY+id,textarea.value);state.textContent="현재 브라우저에 저장했습니다."}catch(err){state.textContent="브라우저 저장 제한으로 저장되지 않았습니다."}}
 if(btn.classList.contains("clear")){textarea.value="";answerCache[id]="";try{StudyStore.removeRaw(KEY+id)}catch(e){}state.textContent="입력을 초기화했습니다."}
});
["yearFilter","topicFilter","keyword"].forEach(id=>$(id).addEventListener(id==="keyword"?"input":"change",render));
$("reset").addEventListener("click",()=>{$("yearFilter").value="";$("topicFilter").value="";$("keyword").value="";render()});
render();
})().catch(e=>{const p=document.createElement("p");p.setAttribute("role","alert");p.textContent="자료 로드 실패: "+e.message;document.querySelector("main")?.prepend(p)});
}).catch(()=>{});</script></body></html>
