<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Communication systems: wireless, optical fiber, submarine cable</title>
  <desc id="desc">A radio antenna sends cyan signals that transition into a glowing optical fiber and a submarine cable running across the ocean floor.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset=".58" stop-color="#0b2340"/>
      <stop offset="1" stop-color="#102e4a"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12466b" stop-opacity=".18"/>
      <stop offset="1" stop-color="#06111e" stop-opacity=".82"/>
    </linearGradient>
    <linearGradient id="fiber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#42d9ff"/>
      <stop offset=".52" stop-color="#9cf4f2"/>
      <stop offset="1" stop-color="#ffc978"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#8cc9ef" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <path d="M0 244 C155 215 245 262 382 238 S650 218 792 247 S1040 270 1200 225 V360 H0Z" fill="url(#sea)"/>
  <path d="M0 244 C155 215 245 262 382 238 S650 218 792 247 S1040 270 1200 225" fill="none" stroke="#4c9fc7" stroke-opacity=".34" stroke-width="2"/>
  <path d="M0 292 C175 264 275 306 436 281 S750 275 910 298 S1084 303 1200 278" fill="none" stroke="#447b9c" stroke-opacity=".18" stroke-width="2"/>
  <!-- wireless mast -->
  <g stroke="#75e5ff" fill="none" stroke-linecap="round">
    <path d="M158 223 177 139 196 223M166 189h22M170 170h14" stroke-width="3"/>
    <circle cx="177" cy="134" r="5" fill="#75e5ff" stroke="none" filter="url(#glow)"/>
    <path d="M157 121c-18 8-28 23-31 41M197 121c18 8 28 23 31 41M146 105c-26 12-41 32-44 57M208 105c26 12 41 32 44 57" stroke-width="2.2" opacity=".8"/>
  </g>
  <!-- signal becomes a fiber path -->
  <path d="M248 156 C321 156 326 192 389 192 C456 192 470 142 542 142 S646 193 724 193 S837 132 910 156 C982 180 1013 220 1083 220" fill="none" stroke="#1daed9" stroke-opacity=".23" stroke-width="14" filter="url(#glow)"/>
  <path d="M248 156 C321 156 326 192 389 192 C456 192 470 142 542 142 S646 193 724 193 S837 132 910 156 C982 180 1013 220 1083 220" fill="none" stroke="url(#fiber)" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)"/>
  <g fill="#d9fbff" filter="url(#glow)">
    <circle cx="389" cy="192" r="4"/><circle cx="542" cy="142" r="4"/><circle cx="724" cy="193" r="4"/><circle cx="910" cy="156" r="4"/>
  </g>
  <!-- seabed cable -->
  <path d="M734 281 C838 265 923 291 1014 280 S1112 273 1200 286" fill="none" stroke="#06111d" stroke-width="13" stroke-linecap="round"/>
  <path d="M734 279 C838 263 923 289 1014 278 S1112 271 1200 284" fill="none" stroke="#f4b969" stroke-width="3" stroke-linecap="round"/>
  <g fill="#f4b969"><circle cx="822" cy="272" r="4"/><circle cx="1015" cy="278" r="4"/><circle cx="1128" cy="275" r="4"/></g>
  <text x="72" y="70" fill="#f3f8ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" letter-spacing="4" font-weight="600">COMMUNICATION SYSTEMS</text>
  <text x="72" y="103" fill="#8bdff5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" letter-spacing="2.2">WIRELESS  /  OPTICAL FIBER  /  SUBMARINE CABLE</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="1.3" font-weight="600">
    <text x="128" y="252" fill="#9cecff">WIRELESS</text>
    <text x="510" y="224" fill="#b2f5f2">OPTICAL FIBER</text>
    <text x="907" y="317" fill="#ffd28d">SUBMARINE CABLE</text>
  </g>
  <path d="M72 326H1128" stroke="#91cde8" stroke-opacity=".14"/>
  <text x="72" y="347" fill="#8ea9c0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" letter-spacing="1.7">MODELING  ·  SYSTEM ANALYSIS  ·  ENGINEERING TOOLS</text>
</svg>
