name: Quiz500 static smoke
on:
  push:
    paths:
      - "quiz500/**"
      - ".github/workflows/quiz500-smoke.yml"
  pull_request:
    paths:
      - "quiz500/**"
      - ".github/workflows/quiz500-smoke.yml"
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static JS, JSON, SEO, and question checks
        run: node quiz500/validation/check.mjs
      - name: Browser 360px and console errors (Chrome)
        run: node quiz500/validation/browser-check.mjs
